# Déploiement en un clic sur Render : New + → Blueprint → ce dépôt.
# Le fichier doit rester à la racine : c'est là que Render le cherche.
# Railway, Fly.io et tout moteur Docker lisent directement bot-engine/Dockerfile.
services:
  - type: web
    name: autoplay-engine
    runtime: docker
    dockerfilePath: ./bot-engine/Dockerfile
    dockerContext: ./bot-engine
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AUTOPLAY_CONFIG
        value: /app/config.json
      - key: WEB_CONCURRENCY
        value: "1"
      - key: AUTOPLAY_ADMIN_KEY
        sync: false
