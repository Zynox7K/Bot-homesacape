name: Android — APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    name: assemblage · JDK 17 · SDK 34
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Extraction du dépôt
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clé de signature de debug
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Plateforme Android 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android-app/**/*.gradle.kts', 'android-app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemblage de l'APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Contrôle du produit
        run: |
          ls -lh app/build/outputs/apk/release/
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Publication de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoPlay-release-apk
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: publication GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupération de l'APK
        uses: actions/download-artifact@v4
        with:
          name: AutoPlay-release-apk
          path: apk

      - name: Renommage
        run: |
          version="${GITHUB_REF_NAME}"
          mv apk/app-release.apk "apk/AutoPlay-${version}.apk"
          ls -lh apk

      - name: Création de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" apk/*.apk \
            --title "AutoPlay ${GITHUB_REF_NAME}" \
            --generate-notes
