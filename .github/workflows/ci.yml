name: Construire l'APK Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The GitHub-hosted Ubuntu runner comes with the Android SDK installed.
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler et tester
        id: build
        working-directory: android-app
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest assembleDebug > "$RUNNER_TEMP/build.log" 2>&1
          result=$?
          for report in app/build/test-results/testDebugUnitTest/TEST-*.xml; do
            if [ -f "$report" ]; then
              python3 -c 'import sys,xml.etree.ElementTree as E; root=E.parse(sys.argv[1]); [print("e: TEST " + c.get("name", "?") + ": " + (c.find("failure").get("message", "failure") if c.find("failure") is not None else "")) for c in root.findall(".//testcase") if c.find("failure") is not None]' "$report" >> "$RUNNER_TEMP/build.log"
            fi
          done
          cat "$RUNNER_TEMP/build.log"
          echo "status=$result" >> "$GITHUB_OUTPUT"
          mapfile -t diagnostics < <({ grep '^e: ' "$RUNNER_TEMP/build.log"; grep -E '^\* What went wrong:|^> |^FAILURE:|^Execution failed|^Could not' "$RUNNER_TEMP/build.log" | grep -v '^> Task'; } | head -5)
          for i in 0 1 2 3 4; do
            line="${diagnostics[$i]:-OK}"
            echo "d$i=${line:0:250}" >> "$GITHUB_OUTPUT"
          done
      - name: 'Diagnostic 1 - ${{ steps.build.outputs.d0 }}'
        run: echo 'Build diagnostic'
      - name: 'Diagnostic 2 - ${{ steps.build.outputs.d1 }}'
        run: echo 'Build diagnostic'
      - name: 'Diagnostic 3 - ${{ steps.build.outputs.d2 }}'
        run: echo 'Build diagnostic'
      - name: 'Diagnostic 4 - ${{ steps.build.outputs.d3 }}'
        run: echo 'Build diagnostic'
      - name: 'Diagnostic 5 - ${{ steps.build.outputs.d4 }}'
        run: exit "${{ steps.build.outputs.status }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bot-local-android-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
      # Publish the installable debug APK to this session's branch only.
      - name: Ajouter l'APK à la branche
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/f301f018-bot-homesacape'
        run: |
          mkdir -p apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk apk/bot-local.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk/bot-local.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Add installable debug APK'
            git push origin HEAD:arena/f301f018-bot-homesacape
          fi
