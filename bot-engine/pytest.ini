[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
    # Starlette signale en UserWarning le remplacement à venir de httpx par httpx2
    # dans son TestClient. Dépréciation interne à la dépendance, sans effet sur
    # nos tests : on la masque pour garder une sortie lisible.
    ignore:Using `httpx` with `starlette.testclient`:UserWarning
